<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neoo English</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
            margin: 0;
            touch-action: manipulation;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 26px;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .chat {
            min-height: 300px;
            max-height: 380px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 15px;
        }
        .msg {
            padding: 12px 18px;
            margin: 8px 0;
            border-radius: 20px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 15px;
        }
        .ai {
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        .user {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        .status {
            text-align: center;
            color: #555;
            margin: 10px 0;
            font-size: 14px;
            min-height: 24px;
            font-weight: 500;
        }
        .status.error {
            color: #e74c3c;
        }
        .status.success {
            color: #27ae60;
        }
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 8px 0;
            font-weight: bold;
        }
        .start {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .start:active {
            transform: scale(0.98);
        }
        .mic {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            font-size: 18px;
        }
        .mic:active {
            transform: scale(0.95);
        }
        .mic.recording {
            background: #e74c3c;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.5); }
            50% { box-shadow: 0 0 0 15px rgba(231,76,60,0); }
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 15px;
            outline: none;
        }
        .input-area input:focus {
            border-color: #667eea;
        }
        .input-area button {
            padding: 14px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }
        .quick {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .quick button {
            padding: 10px 14px;
            background: #e9ecef;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        .quick button:active {
            background: #dee2e6;
        }
        .hidden {
            display: none;
        }
        .permission-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }
        .permission-box p {
            margin: 0 0 15px 0;
            color: #856404;
        }
        .permission-box button {
            background: #ffc107;
            color: #333;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👋 Neoo English Assistant</h1>
        </div>
        
        <div class="card">
            <div id="permissionBox" class="permission-box">
                <p>🎤 Please allow microphone access to use voice</p>
                <button id="allowMicBtn">Allow Microphone</button>
            </div>
            
            <div class="chat" id="chat">
                <div style="text-align: center; color: #999; padding: 50px 0;">
                    <div style="font-size: 45px; margin-bottom: 10px;">🚀</div>
                    <p>Click "Start" to begin</p>
                </div>
            </div>
            
            <div class="status" id="status"></div>
            
            <button class="btn start" id="startBtn">🚀 Start Conversation</button>
            
            <div id="mainArea" class="hidden">
                <button class="btn mic" id="micBtn">🎤 Tap to Speak</button>
                
                <div class="input-area">
                    <input type="text" id="textInput" placeholder="Or type your message...">
                    <button id="sendBtn">Send</button>
                </div>
                
                <div class="quick" id="quick">
                    <button data="Nice to meet you too!">Nice to meet you!</button>
                    <button data="Yes, our melons are very sweet!">Yes, melons!</button>
                    <button data="You can take the train.">Take train</button>
                    <button data="Go straight and turn left.">Go left</button>
                    <button data="Thank you! See you!">Thank you!</button>
                    <button data="The market is near the station.">Market</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dialogues = [
            "Hello! I am Neoo from the UK. Nice to meet you!",
            "I heard your melon is very delicious. Is that true?",
            "That's great! I want to buy some in Xi'an. How can I get to Xi'an?",
            "Where can I buy the melon after arriving?",
            "Thank you so much! How can I get to the melon market?",
            "I am leaving now. See you in Xi'an! Have a nice day!"
        ];

        let step = 0;
        let recognizing = false;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let started = false;
        let micEnabled = false;

        const chat = document.getElementById('chat');
        const startBtn = document.getElementById('startBtn');
        const micBtn = document.getElementById('micBtn');
        const status = document.getElementById('status');
        const mainArea = document.getElementById('mainArea');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const permissionBox = document.getElementById('permissionBox');
        const allowMicBtn = document.getElementById('allowMicBtn');

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'msg ' + (isUser ? 'user' : 'ai');
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function speak(text) {
            if (!started) return;
            synthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1.1;
            synthesis.speak(utterance);
        }

        function getResponse(text) {
            text = text.toLowerCase();
            if (text.includes('plane')) return "You can take a plane. It is very fast.";
            if (text.includes('train')) return "You can take a train. It is comfortable.";
            if (text.includes('bus')) return "You can take the No. 5 bus.";
            if (text.includes('walk')) return "You can walk there in 10 minutes.";
            if (text.includes('how') && text.includes('get')) return "Go straight and turn left.";
            if (text.includes('far')) return "It is about 2 kilometers away.";
            if (text.includes('yes') || text.includes('thank') || text.includes('nice')) return "Great! I'm glad to hear that.";
            return "Sorry, I can only talk about transportation today.";
        }

        function handleInput(userText) {
            if (!started || !userText.trim()) return;
            
            addMessage(userText.trim(), true);
            status.textContent = 'Thinking...';
            status.className = 'status';
            
            step++;
            setTimeout(function() {
                let response;
                if (step < dialogues.length) {
                    response = dialogues[step];
                } else {
                    response = getResponse(userText);
                }
                addMessage(response, false);
                speak(response);
                status.textContent = 'Your turn!';
                status.className = 'status success';
            }, 1200);
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                status.textContent = 'Speech recognition not supported';
                status.className = 'status error';
                return false;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.continuous = false;

            recognition.onstart = function() {
                recognizing = true;
                micBtn.classList.add('recording');
                micBtn.textContent = '🔴 Listening...';
                status.textContent = 'Listening...';
                status.className = 'status';
            };

            recognition.onend = function() {
                recognizing = false;
                micBtn.classList.remove('recording');
                micBtn.textContent = '🎤 Tap to Speak';
            };

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript.trim();
                if (text) {
                    handleInput(text);
                }
            };

            recognition.onerror = function(event) {
                console.error('Speech error:', event.error);
                recognizing = false;
                micBtn.classList.remove('recording');
                micBtn.textContent = '🎤 Tap to Speak';
                
                if (event.error === 'not-allowed') {
                    status.textContent = 'Microphone denied. Use text input.';
                    status.className = 'status error';
                } else if (event.error === 'no-speech') {
                    status.textContent = 'No speech detected. Try again.';
                    status.className = 'status error';
                }
            };

            return true;
        }

        allowMicBtn.addEventListener('click', async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                micEnabled = true;
                permissionBox.classList.add('hidden');
                status.textContent = 'Microphone ready!';
                status.className = 'status success';
                
                if (initSpeechRecognition()) {
                    status.textContent = 'Microphone ready! Tap to speak.';
                }
            } catch (err) {
                status.textContent = 'Please allow microphone in browser settings';
                status.className = 'status error';
            }
        });

        startBtn.addEventListener('click', function() {
            started = true;
            chat.innerHTML = '';
            step = 0;
            
            startBtn.classList.add('hidden');
            mainArea.classList.remove('hidden');
            
            if (!micEnabled && !recognition) {
                permissionBox.classList.remove('hidden');
            }
            
            const firstLine = dialogues[0];
            addMessage(firstLine, false);
            status.textContent = 'Speaking...';
            
            setTimeout(function() {
                speak(firstLine);
                status.textContent = micEnabled ? 'Tap to speak!' : 'Use text input or allow mic';
                status.className = 'status';
            }, 500);
        });

        micBtn.addEventListener('click', function() {
            if (!recognition) {
                if (initSpeechRecognition()) {
                    setTimeout(function() {
                        try { recognition.start(); } catch (e) {}
                    }, 100);
                }
                return;
            }
            
            if (recognizing) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    status.textContent = 'Tap Start first';
                }
            }
        });

        sendBtn.addEventListener('click', function() {
            const text = textInput.value.trim();
            if (text) {
                handleInput(text);
                textInput.value = '';
            }
        });

        textInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const text = textInput.value.trim();
                if (text) {
                    handleInput(text);
                    textInput.value = '';
                }
            }
        });

        document.querySelectorAll('.quick button').forEach(function(btn) {
            btn.addEventListener('click', function() {
                handleInput(btn.getAttribute('data'));
            });
        });

        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            permissionBox.innerHTML = '<p>📝 Use text input for conversation</p>';
        }
    </script>
</body>
</html>
