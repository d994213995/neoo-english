<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neoo English</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 28px;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .chat {
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 15px;
        }
        .msg {
            padding: 12px 18px;
            margin: 8px 0;
            border-radius: 20px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 15px;
        }
        .ai {
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        .user {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        .status {
            text-align: center;
            color: #666;
            margin: 10px 0;
            font-size: 14px;
            min-height: 24px;
        }
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 8px 0;
            font-weight: bold;
        }
        .start {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
        }
        .speak {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            font-size: 18px;
        }
        .speak:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245,87,108,0.4);
        }
        .speak.recording {
            background: #ff4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,68,68,0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255,68,68,0); }
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-area input:focus {
            border-color: #667eea;
        }
        .input-area button {
            padding: 14px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }
        .input-area button:hover {
            background: #5a6fd6;
        }
        .quick {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .quick button {
            padding: 10px 14px;
            background: #e9ecef;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .quick button:hover {
            background: #dee2e6;
        }
        .hidden {
            display: none;
        }
        .system {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin: 10px 0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👋 Neoo English Assistant</h1>
            <p style="opacity: 0.9; margin: 5px 0;">Practice English conversation</p>
        </div>
        
        <div class="card">
            <div class="chat" id="chat">
                <div style="text-align: center; color: #999; padding: 60px 0;">
                    <div style="font-size: 50px; margin-bottom: 15px;">🚀</div>
                    <p style="font-size: 16px;">Click "Start Conversation"</p>
                    <p style="font-size: 14px; margin-top: 5px;">Let's practice English together!</p>
                </div>
            </div>
            
            <div class="status" id="status"></div>
            
            <button class="btn start" id="startBtn">🚀 Start Conversation</button>
            
            <div id="main-area" class="hidden">
                <button class="btn speak" id="speakBtn">🎤 Hold to Speak</button>
                
                <div class="input-area">
                    <input type="text" id="textInput" placeholder="Type your message...">
                    <button id="sendBtn">Send</button>
                </div>
                
                <div class="quick" id="quick">
                    <button data="Nice to meet you too!">Nice to meet you!</button>
                    <button data="Yes, our melons are very sweet!">Yes, melons!</button>
                    <button data="You can take the train.">Take train</button>
                    <button data="Go straight and turn left.">Go left</button>
                    <button data="Thank you! See you!">Thank you!</button>
                    <button data="The market is near the station.">Market location</button>
                </div>
            </div>
        </div>
        
        <div class="system" id="system"></div>
    </div>

    <script>
        const dialogues = [
            "Hello! I am Neoo from the UK. Nice to meet you!",
            "I heard your melon is very delicious. Is that true?",
            "That's great! I want to buy some in Xi'an. How can I get to Xi'an?",
            "Where can I buy the melon after arriving?",
            "Thank you so much! How can I get to the melon market?",
            "I am leaving now. See you in Xi'an! Have a nice day!"
        ];

        let step = 0;
        let recognizing = false;
        let recognition;
        let synthesis = window.speechSynthesis;
        let started = false;

        const chat = document.getElementById('chat');
        const startBtn = document.getElementById('startBtn');
        const speakBtn = document.getElementById('speakBtn');
        const status = document.getElementById('status');
        const mainArea = document.getElementById('main-area');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const system = document.getElementById('system');

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'msg ' + (isUser ? 'user' : 'ai');
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function speak(text) {
            if (!started) return;
            synthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1.1;
            utterance.onend = function() {
                if (step < dialogues.length || started) {
                    status.textContent = 'Your turn!';
                }
            };
            synthesis.speak(utterance);
        }

        function getResponse(text) {
            text = text.toLowerCase();
            if (text.includes('plane') || text.includes('airplane')) return "You can take a plane. It is very fast.";
            if (text.includes('train')) return "You can take a train. It is comfortable and cheap.";
            if (text.includes('bus')) return "You can take the No. 5 bus. It goes there directly.";
            if (text.includes('subway') || text.includes('metro')) return "You can take the subway Line 2. Get off at Bell Tower Station.";
            if (text.includes('walk') || text.includes('foot')) return "It is not far. You can walk there in 10 minutes.";
            if (text.includes('bike') || text.includes('bicycle')) return "You can ride a bike. It is good exercise.";
            if (text.includes('how') && text.includes('get')) return "Go straight and turn left at the first crossing.";
            if (text.includes('where') && text.includes('station')) return "The station is over there. Look for the big blue sign.";
            if (text.includes('far')) return "It is about 2 kilometers away. Not very far.";
            if (text.includes('long') && text.includes('take')) return "It takes about 20 minutes by bus.";
            if (text.includes('yes') || text.includes('thank') || text.includes('nice')) return "Great! I'm glad to hear that.";
            return "Sorry, I can only talk about transportation and directions today.";
        }

        function handleInput(userText) {
            if (!started || !userText.trim()) return;
            
            addMessage(userText.trim(), true);
            status.textContent = 'Neoo is thinking...';
            
            step++;
            setTimeout(function() {
                let response;
                if (step < dialogues.length) {
                    response = dialogues[step];
                } else {
                    response = getResponse(userText);
                }
                addMessage(response, false);
                speak(response);
            }, 1200);
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                system.textContent = '⚠️ Speech recognition not supported, use text input';
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                recognizing = true;
                speakBtn.classList.add('recording');
                speakBtn.textContent = '🔴 Recording...';
                status.textContent = 'Listening...';
            };

            recognition.onend = function() {
                recognizing = false;
                speakBtn.classList.remove('recording');
                speakBtn.textContent = '🎤 Hold to Speak';
            };

            recognition.onresult = function(event) {
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        const text = event.results[i][0].transcript.trim();
                        if (text) {
                            handleInput(text);
                        }
                    }
                }
            };

            recognition.onerror = function(event) {
                console.error('Recognition error:', event.error);
                if (event.error === 'not-allowed') {
                    status.textContent = 'Please allow microphone access';
                }
            };
        }

        startBtn.addEventListener('click', function() {
            started = true;
            chat.innerHTML = '';
            step = 0;
            
            startBtn.classList.add('hidden');
            mainArea.classList.remove('hidden');
            
            const firstLine = dialogues[0];
            addMessage(firstLine, false);
            status.textContent = 'Neoo is speaking...';
            
            setTimeout(function() {
                speak(firstLine);
            }, 500);
        });

        speakBtn.addEventListener('mousedown', function() {
            if (!recognition) initSpeechRecognition();
            if (recognition && !recognizing) {
                try {
                    recognition.start();
                } catch (e) {
                    status.textContent = 'Click Start first';
                }
            }
        });

        speakBtn.addEventListener('mouseup', function() {
            if (recognition && recognizing) {
                recognition.stop();
            }
        });

        speakBtn.addEventListener('mouseleave', function() {
            if (recognition && recognizing) {
                recognition.stop();
            }
        });

        speakBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (!recognition) initSpeechRecognition();
            if (recognition && !recognizing) {
                recognition.start();
            }
        }, { passive: false });

        speakBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            if (recognition && recognizing) {
                recognition.stop();
            }
        }, { passive: false });

        sendBtn.addEventListener('click', function() {
            const text = textInput.value.trim();
            if (text) {
                handleInput(text);
                textInput.value = '';
            }
        });

        textInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const text = textInput.value.trim();
                if (text) {
                    handleInput(text);
                    textInput.value = '';
                }
            }
        });

        document.querySelectorAll('.quick button').forEach(function(btn) {
            btn.addEventListener('click', function() {
                handleInput(btn.getAttribute('data'));
            });
        });

        initSpeechRecognition();
    </script>
</body>
</html>
