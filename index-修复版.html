<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neoo English</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 28px;
            margin: 0;
        }
        .chat-box {
            background: white;
            border-radius: 20px;
            padding: 20px;
            min-height: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .message {
            margin: 10px 0;
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 80%;
        }
        .ai-message {
            background: #f0f0f0;
            color: #333;
            border-radius: 20px 20px 20px 5px;
        }
        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            border-radius: 20px 20px 5px 20px;
        }
        .status {
            text-align: center;
            color: #666;
            margin: 10px 0;
        }
        .btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 0;
        }
        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        .btn-speak {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 20px;
        }
        .btn-speak:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245,87,108,0.4);
        }
        .btn-speak.recording {
            background: #ff4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,68,68,0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255,68,68,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,68,68,0); }
        }
        .hidden {
            display: none;
        }
        .quick-phrases {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }
        .quick-btn {
            padding: 8px 16px;
            background: #e8e8e8;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .quick-btn:hover {
            background: #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👋 Neoo English Assistant</h1>
            <p style="opacity: 0.9;">Practice English conversation</p>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div style="text-align: center; color: #999; padding: 40px 0;">
                <div style="font-size: 48px; margin-bottom: 10px;">🚀</div>
                <p>Click "Start Conversation"</p>
                <p>Let's practice English!</p>
            </div>
        </div>
        
        <div class="status" id="status"></div>
        
        <button class="btn btn-start" id="startBtn">🚀 Start Conversation</button>
        <button class="btn btn-speak hidden" id="speakBtn">🎤 Hold to Speak</button>
        
        <div class="quick-phrases hidden" id="quickPhrases">
            <button class="quick-btn" data-text="Nice to meet you too!">Nice to meet you!</button>
            <button class="quick-btn" data-text="You can take the train.">Take train</button>
            <button class="quick-btn" data-text="Go straight and turn left.">Go straight</button>
            <button class="quick-btn" data-text="See you!">See you!</button>
        </div>
    </div>

    <script>
        const lines = [
            "Hello! I am Neoo from the UK. Nice to meet you!",
            "I heard your melon is very delicious. Is that true?",
            "That's great! I want to buy some in Xi'an. How can I get to Xi'an?",
            "Where can I buy the melon after arriving?",
            "Thank you so much! How can I get to the melon market?",
            "I am leaving now. See you in Xi'an! Have a nice day!"
        ];

        let stage = 0;
        let isRecording = false;
        let recognition;
        let synthesis = window.speechSynthesis;

        const chatBox = document.getElementById('chatBox');
        const startBtn = document.getElementById('startBtn');
        const speakBtn = document.getElementById('speakBtn');
        const status = document.getElementById('status');
        const quickPhrases = document.getElementById('quickPhrases');

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = isUser ? 'message user-message' : 'message ai-message';
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function speak(text) {
            if (!window.userActivated) return;
            synthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-US';
            utter.rate = 0.85;
            utter.pitch = 1.1;
            synthesis.speak(utter);
        }

        function getResponse(text) {
            text = text.toLowerCase();
            if (text.includes('plane')) return "You can take a plane. It is very fast.";
            if (text.includes('train')) return "You can take a train. It is comfortable.";
            if (text.includes('bus')) return "You can take the No. 5 bus.";
            if (text.includes('subway')) return "Take subway Line 2.";
            if (text.includes('walk')) return "You can walk there in 10 minutes.";
            if (text.includes('how') && text.includes('get')) return "Go straight and turn left.";
            if (text.includes('far')) return "It is about 2 kilometers away.";
            return "Sorry, I can only talk about transportation.";
        }

        function handleInput(text) {
            addMessage(text, true);
            status.textContent = 'Neoo is thinking...';
            
            stage++;
            if (stage < lines.length) {
                setTimeout(() => {
                    const response = lines[stage];
                    addMessage(response, false);
                    speak(response);
                    status.textContent = 'Your turn!';
                }, 1200);
            } else {
                setTimeout(() => {
                    const response = getResponse(text);
                    addMessage(response, false);
                    speak(response);
                    status.textContent = 'Your turn!';
                }, 1000);
            }
        }

        function initRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                status.textContent = 'Your browser does not support speech recognition.';
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecording = true;
                speakBtn.classList.add('recording');
                speakBtn.textContent = '🔴 Recording...';
                status.textContent = 'Listening...';
            };

            recognition.onend = () => {
                isRecording = false;
                speakBtn.classList.remove('recording');
                speakBtn.textContent = '🎤 Hold to Speak';
                status.textContent = '';
            };

            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript.trim();
                if (text) handleInput(text);
            };
        }

        startBtn.addEventListener('click', () => {
            window.userActivated = true;
            chatBox.innerHTML = '';
            stage = 0;
            
            startBtn.classList.add('hidden');
            speakBtn.classList.remove('hidden');
            quickPhrases.classList.remove('hidden');
            
            const firstLine = lines[0];
            addMessage(firstLine, false);
            status.textContent = 'Neoo is speaking...';
            
            setTimeout(() => {
                speak(firstLine);
                status.textContent = 'Your turn!';
            }, 500);
        });

        speakBtn.addEventListener('mousedown', () => {
            if (!recognition) initRecognition();
            if (recognition) recognition.start();
        });

        speakBtn.addEventListener('mouseup', () => {
            if (recognition && isRecording) recognition.stop();
        });

        speakBtn.addEventListener('mouseleave', () => {
            if (recognition && isRecording) recognition.stop();
        });

        speakBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!recognition) initRecognition();
            if (recognition) recognition.start();
        }, { passive: false });

        speakBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (recognition && isRecording) recognition.stop();
        }, { passive: false });

        document.querySelectorAll('.quick-btn').forEach(btn => {
            btn.addEventListener('click', () => handleInput(btn.dataset.text));
        });

        initRecognition();
    </script>
</body>
</html>
